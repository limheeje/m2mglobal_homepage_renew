  <line x1="415" y1="400" x2="545" y2="400" stroke="#CCD7E8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="480" y="425" text-anchor="middle" fill="#333333" font-size="13">모델 버전 관리</text>
  <line x1="415" y1="445" x2="545" y2="445" stroke="#CCD7E8" stroke-width="1" stroke-dasharray="2,2"/>
