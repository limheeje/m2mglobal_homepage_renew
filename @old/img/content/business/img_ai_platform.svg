<svg width="1200" height="720" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <!-- Background -->
  <rect width="1200" height="720" fill="#FFFFFF"/>

  <!-- ===== HEADER ===== -->
  <rect x="0" y="0" width="1200" height="70" fill="#1E40AF"/>
  <text x="600" y="44" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="700">AI / ML 플랫폼 구성도</text>

  <!-- ===== LEFT CARD: 데이터 / 학습 ===== -->
  <rect x="30" y="100" width="560" height="580" fill="none" stroke="#B6C7E3" stroke-width="1.5" rx="6"/>
  <text x="310" y="138" text-anchor="middle" fill="#333333" font-size="18" font-weight="700">데이터 수집 &amp; 모델 학습</text>

  <!-- Left Column 1: 데이터 수집 -->
  <rect x="55" y="170" width="160" height="490" fill="#F4F8FF" stroke="#DCE6F4" stroke-width="1" rx="4"/>
  <text x="135" y="200" text-anchor="middle" fill="#1E40AF" font-size="15" font-weight="700">데이터 수집</text>
  <line x1="75" y1="215" x2="195" y2="215" stroke="#00A8E8" stroke-width="2"/>

  <text x="135" y="245" text-anchor="middle" fill="#333333" font-size="13">사용자 행동</text>
  <line x1="75" y1="265" x2="195" y2="265" stroke="#CCD7E8" stroke-width="1" stroke-dasharray="2,2"/>
