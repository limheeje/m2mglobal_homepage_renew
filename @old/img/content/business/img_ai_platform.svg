  <line x1="415" y1="215" x2="545" y2="215" stroke="#00A8E8" stroke-width="2"/>

  <text x="480" y="245" text-anchor="middle" fill="#333333" font-size="13">Collaborative Filter</text>
  <line x1="415" y1="265" x2="545" y2="265" stroke="#CCD7E8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="480" y="290" text-anchor="middle" fill="#333333" font-size="13">Learning-to-Rank</text>
  <line x1="415" y1="310" x2="545" y2="310" stroke="#CCD7E8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="480" y="335" text-anchor="middle" fill="#333333" font-size="13">YOLO / Deep Learning</text>
  <line x1="415" y1="355" x2="545" y2="355" stroke="#CCD7E8" stroke-width="1" stroke-dasharray="2,2"/>
