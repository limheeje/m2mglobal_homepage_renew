<button type="button" id="btnTop" class="btn-top"><span>Top</span></button>

<script type="text/javascript">
  $(function(){
    // top 버튼 클릭시
    $("#btnTop").click(function() {
      $('html, body').animate({ scrollTop : 0 }, 100);
      $(this).addClass('active');
      $('.location').removeClass('is-fixed');
      const para = document.location.href.split("#")[0];
      window.location = para;
    });

    //footerWrap
    $('.partner-title').on('click', function (e) {
      $(this).next('ul').stop().slideToggle(300);
      e.preventDefault();
    });
    $('.partner-title').on('click', function () {
        $(this).closest('ul').stop().slideUp(300);
    });
  })
</script>
