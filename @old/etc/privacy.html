            <h4>개인정보처리방침</h4>
            <!--<p class="txt03">엠투엠글로벌㈜(이하 ‘회사’라 한다)는 개인정보 보호법 제30조에 따라 정보주체의 개인정보를 보호하고 이와 관련한 고충을 신속하고 원활하게 처리할 수 있도록 하기 위하여 다음과 같이 개인정보 처리지침을 수립․공개합니다.<br><Br>

            제1조(개인정보의 수집 및 이용 목적)<br><Br>

            회사는 수집한 개인정보를 다음의 목적을 위해 사용하며, 사용 목적이 변경될 경우 사전 동의를 구할것입니다.<br><Br>

            가. 차량 실시간 모니터링, 운행경로 조회, 운행기록 분석 등 차량관제서비스서비스 제공에 관한 계약 이행<br>

            나. 본인인증 및 부정이용 방지, 공지사항전달 등<br>
            다. 차량 및 운전자에 대한 상세정보 제공 등<br><br>

            제2조(개인정보의 처리 및 보유기간)<br><br>

            ① 회사는 개인정보의 수집목적 또는 제공받은 목적이 달성된 때에는 고객의 개인정보를 지체없이 파기합니다.<br><br>

            ※ 단, 1년 이상 미접속자의 경우 자동 회원탈퇴 및 개인정보를 삭제합니다.<br><br>

            ② 단, 상법 등 관련법령의 규정 및 내부 방침에 의해 다음과 같이 거래 관련 권리 의무 관계의 확인등을 이유로 일정기간 보유해야 할 필요가 있을 경우에는 일정기간(1년) 보유합니다.<br><br>

            제3조(개인정보의 제3자 제공)<br><br>

            회사는 회원에 대하여 보다 더 질 높은 서비스 제공 등을 위해 회원의 개인정보를 제3자에게 제공하는 경우에는 별도의 절차를 통해 회원의 동의를 구하겠으며, 회원의 동의 없이는 회원의 개인정보를 제3자 등에게 제공하지 않습니다.<br><br>


            제4조(정보주체의 권리․의무 및 행사방법)<br><br>

            ① 정보주체는 회사에 대해 언제든지 다음 각 호의 개인정보 보호 관련 권리를 행사할 수 있습니다.<br><br>

            1) 개인정보 열람요구<br><br>

            2) 오류 등이 있을 경우 정정 요구<br><br>

            3) 삭제요구<br><br>

            4) 처리정지 요구<br><br>

            (1) 제1항에 따른 권리 행사는 회사에 대해 서면, 전화, 전자우편, 모사전송<br><br>

            (FAX) 등을 통하여 하실 수 있으며 회사는 이에 대해 지체없이 조치하겠습니다.<br><br>

            (2) 정보주체가 개인정보의 오류 등에 대한 정정 또는 삭제를 요구한 경우에는 회사는 정정 또는 삭제를 완료할 때까지 당해 개인정보를 이용하거나 제공하지 않습니다.<br><br>

            (3) 제1항에 따른 권리 행사는 정보주체의 법정대리인이나 위임을 받은 자등 대리인을 통하여 하실수 있습니다. 이 경우 개인정보 보호법 시행규칙 별지 제11호 서식에 따른 위임장을 제출하셔야 합니다.<br><br>

            (4) 정보주체는 개인정보 보호법 등 관계법령을 위반하여 회사가 처리하고 있는 정보주체 본인이나 타인의 개인정보 및 사생활을 침해하여서는 아니됩니다.<br><br>

            제5조(처리하는 개인정보 항목)<br><br>

            회사는 다음의 개인정보 항목을 처리하고 있습니다.<br><br>

            1. 서비스 제공<br><br>

            - 필수항목 : 성명, 아이디, 비밀번호, 주소, 전화번호, 이메일 주소, 차량번호<br><br>


            2. 인터넷 서비스 이용과정에서 아래 개인정보 항목이 자동으로 생성되어 수집될 수 있습니다.<br><br>

            - IP주소,쿠키, MAC주소, 서비스 이용기록, 방문기록, 불량 이용기록 등<br><br>

            제6조(개인정보의 파기)<br><br>

            ① 회사는 개인정보 보유기간의 경과, 처리목적 달성 등 개인정보가 불필요하게 되었을 때에는 지체없이 해당 개인정보를 파기합니다.<br><br>

            ② 정보주체로부터 동의 받은 개인정보 보유기간이 경과하거나 처리 목적이 달성되었음에도 불구하고 다른 법령에 따라 개인정보를 계속 보존하여야 하는 경우에는,  해당 개인정보를 별도의 데이터베이스(DB)로 옮기거나 보관장소를 달리하여 보존합니다.<br><br>

            ③ 개인정보 파기의 절차 및 방법은 다음과 같습니다.<br><br>

            1) 파기절차<br><br>

            회사는 파기 사유가 발생한 개인정보를 선정하고, 회사의 개인정보 보호책임자의 승인을 받아 개인정보를 파기합니다.<br><br>

            2) 파기방법<br><br>

            회사는 전자적 파일 형태로 기록․저장된 개인정보는 기록을 재생할 수 없도록 로우레밸 포맷(Low Level Format) 등의 방법을 이용하여 파기하며, 종이 문서에 기록․저장된 개인정보는 분쇄기로 분쇄하거나 소각하여 파기합니다.<br><br>

            제7조(개인정보의 안전성 확보 조치)<br><br>

            회사는 개인정보의 안전성 확보를 위해 다음과 같은 조치를 취하고 있습니다.<br><br>

            1. 관리적 조치 : 내부관리계획 수립․시행, 정기적 직원 교육 등<br><br>

            2. 기술적 조치 : 개인정보처리시스템 등의 접근권한 관리, 고유식별정보 등의<br><br>


            암호화<br><br>

            3. 물리적 조치 : 자료보관실 등의 접근통제<br><br>

            제8조(개인정보 자동 수집 장치의 설치∙운영 및 거부에 관한 사항)<br><br>

            ① 회사는 이용자에게 개별적인 맞춤서비스를 제공하기 위해 이용 정보를 저장하고 수시로 불러오는 ‘쿠키(cookie)’를 사용합니다.<br><br>

            ② 쿠키는 웹사이트를 운영하는데 이용되는 서버(http)가 이용자의 컴퓨터 브라우저에게 보내는 소량의 정보이며 이용자들의 PC 컴퓨터 내의 하드디스크에 저장되기도 합니다.<br><br>

            가. 쿠키의 사용목적: 이용자가 방문한 각 서비스와 웹 사이트들에 대한 방문 및 이용형태, 인기 검색어, 보안접속 여부, 등을 파악하여 이용자에게 최적화된 정보 제공을 위해 사용됩니다.<br><br>

            나. 쿠키의 설치∙운영 및 거부 : 웹 브라우저 상단의 도구>인터넷 옵션>개인정보 메뉴의 옵션 설정을 통해 쿠키 저장을 거부 할 수 있습니다.<br><br>

            다. 쿠키 저장을 거부할 경우 맞춤형 서비스 이용에 어려움이 발생할 수 있습니다.<br><br>

            제9조(개인정보 보호책임자)<br><br>

            ① 회사는 개인정보 처리에 관한 업무를 총괄해서 책임지고, 개인정보 처리와 관련한 정보주체의 불만처리 및 피해구제 등을 위하여 아래와 같이 개인정보 보호책임자를 지정하고 있습니다.<br><br>
