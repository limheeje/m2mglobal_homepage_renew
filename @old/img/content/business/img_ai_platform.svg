  <line x1="75" y1="310" x2="195" y2="310" stroke="#CCD7E8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="135" y="335" text-anchor="middle" fill="#333333" font-size="13">이미지 / 영상</text>
  <line x1="75" y1="355" x2="195" y2="355" stroke="#CCD7E8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="135" y="380" text-anchor="middle" fill="#333333" font-size="13">트랜잭션</text>
  <line x1="75" y1="400" x2="195" y2="400" stroke="#CCD7E8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="135" y="425" text-anchor="middle" fill="#333333" font-size="13">실시간 이벤트</text>
  <line x1="75" y1="445" x2="195" y2="445" stroke="#CCD7E8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="135" y="470" text-anchor="middle" fill="#333333" font-size="13">로그 데이터</text>

  <!-- Left Column 2: 데이터 처리 -->
  <rect x="225" y="170" width="160" height="490" fill="#F4F8FF" stroke="#DCE6F4" stroke-width="1" rx="4"/>
  <text x="305" y="200" text-anchor="middle" fill="#1E40AF" font-size="15" font-weight="700">데이터 처리</text>
  <line x1="245" y1="215" x2="365" y2="215" stroke="#00A8E8" stroke-width="2"/>

