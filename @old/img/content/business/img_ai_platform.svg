  <text x="720" y="335" text-anchor="middle" fill="#333333" font-size="13">이미지 객체 탐지</text>
  <line x1="655" y1="355" x2="785" y2="355" stroke="#CCD7E8" stroke-width="1" stroke-dasharray="2,2"/>
