  <line x1="245" y1="355" x2="365" y2="355" stroke="#CCD7E8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="305" y="380" text-anchor="middle" fill="#333333" font-size="13">실시간 파이프라인</text>
  <line x1="245" y1="400" x2="365" y2="400" stroke="#CCD7E8" stroke-width="1" stroke-dasharray="2,2"/>
