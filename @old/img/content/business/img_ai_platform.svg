  <line x1="835" y1="310" x2="955" y2="310" stroke="#CCD7E8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="895" y="335" text-anchor="middle" fill="#333333" font-size="13">성능 모니터링</text>
  <line x1="835" y1="355" x2="955" y2="355" stroke="#CCD7E8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="895" y="380" text-anchor="middle" fill="#333333" font-size="13">로깅 / 알람</text>
  <line x1="835" y1="400" x2="955" y2="400" stroke="#CCD7E8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="895" y="425" text-anchor="middle" fill="#333333" font-size="13">자동 재학습</text>
  <line x1="835" y1="445" x2="955" y2="445" stroke="#CCD7E8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="895" y="470" text-anchor="middle" fill="#333333" font-size="13">대시보드</text>

  <!-- Right Column 3: 인프라 -->
  <rect x="985" y="170" width="160" height="490" fill="#F4F8FF" stroke="#DCE6F4" stroke-width="1" rx="4"/>
  <text x="1065" y="200" text-anchor="middle" fill="#1E40AF" font-size="15" font-weight="700">인프라 / 연계</text>
  <line x1="1005" y1="215" x2="1125" y2="215" stroke="#00A8E8" stroke-width="2"/>

  <text x="1065" y="245" text-anchor="middle" fill="#333333" font-size="13">AWS / Cloud</text>
  <line x1="1005" y1="265" x2="1125" y2="265" stroke="#CCD7E8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="1065" y="290" text-anchor="middle" fill="#333333" font-size="13">On-Premise</text>
  <line x1="1005" y1="310" x2="1125" y2="310" stroke="#CCD7E8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="1065" y="335" text-anchor="middle" fill="#333333" font-size="13">GPU / Non-GPU</text>
  <line x1="1005" y1="355" x2="1125" y2="355" stroke="#CCD7E8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="1065" y="380" text-anchor="middle" fill="#333333" font-size="13">Docker / MSA</text>
  <line x1="1005" y1="400" x2="1125" y2="400" stroke="#CCD7E8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="1065" y="425" text-anchor="middle" fill="#333333" font-size="13">CI / CD 파이프라인</text>
  <line x1="1005" y1="445" x2="1125" y2="445" stroke="#CCD7E8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="1065" y="470" text-anchor="middle" fill="#333333" font-size="13">레거시 시스템 연계</text>

  <!-- Bottom note on right card -->
  <text x="890" y="630" text-anchor="middle" fill="#1E40AF" font-size="13" font-weight="700">FastAPI · Spring Boot · Kafka · Redis · MySQL · MSSQL</text>

</svg>
