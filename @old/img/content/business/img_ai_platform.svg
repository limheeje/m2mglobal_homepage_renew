  <line x1="655" y1="400" x2="785" y2="400" stroke="#CCD7E8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="720" y="425" text-anchor="middle" fill="#333333" font-size="13">수요 예측</text>
  <line x1="655" y1="445" x2="785" y2="445" stroke="#CCD7E8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="720" y="470" text-anchor="middle" fill="#333333" font-size="13">이탈 위험 탐지</text>

