  <text x="895" y="200" text-anchor="middle" fill="#1E40AF" font-size="15" font-weight="700">운영 / 모니터링</text>
  <line x1="835" y1="215" x2="955" y2="215" stroke="#00A8E8" stroke-width="2"/>

